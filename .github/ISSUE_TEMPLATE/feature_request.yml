name: Feature request
description: Suggest something RabbitPay should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
